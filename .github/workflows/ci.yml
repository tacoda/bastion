# The checks every push passes (PLAN.md §6, D19). The toolchain comes from
# rust-toolchain.toml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      # The tray icon (bastion-tray) needs GTK and an app indicator on Linux.
      - name: Linux packages
        if: runner.os == 'Linux'
        # A mirror that hangs or drops a file fails here, not after hours.
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Seams
        run: scripts/check-seams.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
