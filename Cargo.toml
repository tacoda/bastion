[workspace]
resolver = "3"
members = [
    "crates/bastion-core",
    "crates/bastion-protocol",
    "crates/bastion-server",
    "crates/bastion-desktop",
    "crates/bastion-spikes",
    "workers/bastion-openai-compat",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Dependencies build with no debug info, which keeps target/ small.
[profile.dev.package."*"]
debug = false
