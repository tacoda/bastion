[package]
name = "bastion-ui"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bastion's pages: Leptos, client-side rendered to WASM by Trunk."

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "EventTarget", "Headers", "Request", "RequestInit", "Response", "ReadableStream", "ReadableStreamDefaultReader"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
bastion-protocol = { path = "crates/bastion-protocol" }
console_error_panic_hook = "0.1.7"

[workspace]
members = ["src-tauri", "crates/bastion-core", "crates/bastion-protocol", "crates/bastion-server", "crates/bastion-spikes", "crates/bastion-desktop", "workers/bastion-openai-compat"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Dependencies build with no debug info, which keeps target/ small.
[profile.dev.package."*"]
debug = false
