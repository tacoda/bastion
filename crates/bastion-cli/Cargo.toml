[package]
name = "bastion-cli"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bastion's command line (PLAN.md I4): list jobs, submit a request, approve, send back, stop and follow, on any Bastion server, through the client library."

[[bin]]
name = "bastion"
path = "src/main.rs"

[dependencies]
bastion-client = { path = "../bastion-client" }
bastion-protocol = { path = "../bastion-protocol" }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
minisign-verify = "0.3"
sha2 = "0.10"
