[package]
name = "bastion-desktop"
version = "0.1.1"
edition = "2024"
publish = false
description = "Bastion's native client on iced (DECISIONS.md D37): the window, its pages, and the Bastion servers it talks to."

[dependencies]
iced = { version = "=0.14.0", features = ["advanced", "canvas", "markdown", "svg", "tokio"] }
bastion-protocol = { path = "../bastion-protocol" }
bastion-client = { path = "../bastion-client" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["time"] }

# The Dock shows a bare binary's generic icon; AppKit sets the castle.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
