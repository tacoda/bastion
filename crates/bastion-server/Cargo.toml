[package]
name = "bastion-server"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bastion's server (PLAN.md D27): the factory, the store, the gate and the stack, over iii."

[dependencies]
iii-sdk = "=0.25.0"
axum = "0.8"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bastion-protocol = { path = "../bastion-protocol" }
bastion-core = { path = "../bastion-core" }
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "sync", "net", "signal"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }


[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
bastion-core = { path = "../bastion-core", features = ["fixtures"] }
