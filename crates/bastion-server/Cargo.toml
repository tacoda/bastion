[package]
name = "bastion-server"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bastion's server (PLAN.md D27): the factory, the store, the gate and the stack, over iii."

[dependencies]
iii-sdk = "=0.25.0"
axum = "0.8"
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bastion-protocol = { path = "../bastion-protocol" }
bastion-core = { path = "../bastion-core" }
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "sync", "net"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"

[features]
# The in-memory engine, store and machine, for tests outside this crate.
fakes = []

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
bastion-core = { path = "../bastion-core", features = ["fixtures"] }
