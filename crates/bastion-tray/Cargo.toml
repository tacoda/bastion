[package]
name = "bastion-tray"
version = "0.1.1"
edition = "2024"
publish = false
description = "Bastion's tray icon (F9): what the local Bastion server is doing, and approve, pause intake or open the window, while the window is closed. It reaches the server only through bastion-client."

[[bin]]
name = "bastion-tray"
path = "src/main.rs"

[dependencies]
bastion-client = { path = "../bastion-client" }
bastion-protocol = { path = "../bastion-protocol" }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
tao = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tray-icon = "0.26"
