[package]
name = "bastion-mcp"
version = "0.1.0"
edition = "2024"
publish = false
description = "Each tool of each MCP server the admin lists, as an iii function."

[dependencies]
iii-sdk = "=0.25.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "sync", "signal"] }
