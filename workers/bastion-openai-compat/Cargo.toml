[package]
name = "bastion-openai-compat"
version = "0.1.0"
edition = "2024"
publish = false
description = "One llm-router provider per OpenAI-compatible host the admin lists."

[dependencies]
iii-sdk = "=0.25.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "sync", "signal"] }
